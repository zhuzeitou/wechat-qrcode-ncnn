name: Reusable Windows Build

on:
  workflow_call:
    outputs:
      artifact-name-prefix:
        description: "Prefix for Windows artifacts"
        value: "windows-"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            runner: windows-latest
          - arch: x86
            msvc_arch: amd64_x86
            runner: windows-latest
          - arch: arm64
            msvc_arch: amd64_arm64
            runner: windows-2022

    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSVC Dev Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ccache-windows-${{ matrix.arch }}

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Install
        run: cmake --install build --prefix ./install_output

      - name: Verify artifacts
        run: |
          if (Test-Path install_output/bin/zzt_qrcode.dll) {
            Write-Host "✅ zzt_qrcode.dll found"
          } else {
            Write-Error "❌ zzt_qrcode.dll not found"
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: install_output/
