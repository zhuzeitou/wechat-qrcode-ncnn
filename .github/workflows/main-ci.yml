name: Main CI Orchestrator

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
      - '.clang-format'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
      - '.clang-format'
  workflow_dispatch:

jobs:
  windows-build:
    uses: ./.github/workflows/reusable-windows.yml

  macos-build:
    uses: ./.github/workflows/reusable-macos.yml

  linux-build:
    uses: ./.github/workflows/reusable-linux.yml

  ios-build:
    uses: ./.github/workflows/reusable-ios.yml

  android-native-build:
    uses: ./.github/workflows/reusable-android-native.yml

  android-gradle-build:
    needs: [android-native-build]
    uses: ./.github/workflows/reusable-android-gradle.yml
    with:
      native-artifact-name: android-core-libs

  unity-packaging:
    needs: [windows-build, linux-build, macos-build, android-native-build]
    uses: ./.github/workflows/reusable-unity.yml
    with:
      android-artifact-name: android-core-libs
      windows-x64-artifact-name: windows-x64
      windows-x86-artifact-name: windows-x86
      linux-artifact-name: linux-x86_64
      macos-arm64-artifact-name: macos-arm64
      macos-x86_64-artifact-name: macos-x86_64
