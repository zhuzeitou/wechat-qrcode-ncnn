name: Reusable Android Native Build

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "The name of the uploaded artifact"
        value: "android-core-libs"

jobs:
  build-abi:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        include:
          - abi: arm64-v8a
            extra_args: ""
          - abi: armeabi-v7a
            extra_args: "-DANDROID_ARM_NEON=ON"
          - abi: x86
            extra_args: ""
          - abi: x86_64
            extra_args: ""

    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          key: ccache-android-native-${{ matrix.abi }}

      - name: Build ${{ matrix.abi }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            ${{ matrix.extra_args }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cmake --install build --prefix ./install_android/${{ matrix.abi }}

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v6
        with:
          name: _tmp-android-abi-${{ matrix.abi }}
          path: install_android/

  assemble-android-libs:
    needs: build-abi
    runs-on: ubuntu-latest
    name: Assemble Android Native Libs
    steps:
      - name: Download all ABIs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: _tmp-android-abi-*
          path: install_android

      - name: Verify and Organize
        run: |
          ls -R install_android/
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "Checking $abi..."
            # download-artifact with pattern might create subdirectories named after the artifact
            # We want to ensure the final structure is install_android/<abi>/...
            # The upload for each abi was install_android/ which contains <abi>/
            # So download path 'install_android' will result in:
            # install_android/_tmp-android-abi-arm64-v8a/arm64-v8a/...
            
            SOURCE_DIR="install_android/_tmp-android-abi-$abi/$abi"
            if [ -d "$SOURCE_DIR" ]; then
              mkdir -p final_install/$abi
              cp -r $SOURCE_DIR/* final_install/$abi/
              echo "✅ $abi organized"
            else
              echo "❌ $abi not found in $SOURCE_DIR"
              exit 1
            fi
          done

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-core-libs
          path: final_install/

      - name: Cleanup temporary artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: _tmp-android-abi-*
